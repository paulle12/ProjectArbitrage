networks:
  app-network:
    driver: bridge

services:
  redis:
    image: redis:7
    container_name: redis_server
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app1:
    build: .
    container_name: prediction_app1
    env_file: .env.app1
    environment:
      SERVER_PORT: 8080
      APP_ROLE: publisher
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      SPRING_LIQUIBASE_ENABLED: false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "8081:8080"
    volumes:
      - ./keys:/keys

  app2:
    build: .
    container_name: prediction_app2
    env_file: .env.app2
    environment:
      SERVER_PORT: 8080
      APP_ROLE: consumer
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      SPRING_LIQUIBASE_ENABLED: false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "8082:8080"
    volumes:
      - ./keys:/keys
