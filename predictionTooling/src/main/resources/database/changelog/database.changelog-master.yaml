databaseChangeLog:
  - changeSet:
      id: 1
      author: dev
      changes:
        - createTable:
            tableName: orderbook_updates
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: market_ticker
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: orderbook_updates
            columnNames: market_ticker, timestamp
            constraintName: unique_contract_timestamp

  - changeSet:
      id: 2
      author: dev
      changes:
        - createIndex:
            tableName: orderbook_updates
            indexName: idx_orderbook_contract_time
            columns:
              - column:
                  name: market_ticker
              - column:
                  name: timestamp
        - createIndex:
            tableName: orderbook_updates
            indexName: idx_orderbook_payload_gin
            using: GIN
            columns:
              - column:
                  name: payload

  - changeSet:
      id: 3
      author: dev
      changes:
        - insert:
            tableName: orderbook_updates
            columns:
              - column:
                  name: market_ticker
